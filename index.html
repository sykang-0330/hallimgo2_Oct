<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어Ⅱ 지문 복습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F3F6FA; --surface:#FFFFFF; --sunk:#EBF0F6;
  --ink:#1B2436; --ink2:#4F5B70; --ink3:#7A8599; --line:#D9E0EA;
  --navy:#23407A; --navy-ink:#FFFFFF;
  --hl:rgba(255,222,70,.75);
  --topic:#2459C2; --conn:#0C8460; --ref:#7646C7;
  --ok:#1A8550; --ok-bg:#E7F5EC; --bad:#C23B2B; --bad-bg:#FCEBE8; --hint-bg:#FFF6D6; --hint-ink:#7A5A00;
  --cS:#2459C2; --cV:#C23B2B; --cO:#1A8550; --cC:#7646C7; --cM:#69758A; --cX:#B06A00;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#11151D; --surface:#19202B; --sunk:#222B38;
    --ink:#E6EBF2; --ink2:#AEB8C7; --ink3:#8691A3; --line:#2E3847;
    --navy:#8FB0F0; --navy-ink:#0E1420;
    --hl:rgba(255,210,40,.30);
    --topic:#7EA8F5; --conn:#4FCFA3; --ref:#BB98F5;
    --ok:#56C98A; --ok-bg:#16301F; --bad:#F08573; --bad-bg:#3A1C18; --hint-bg:#352C10; --hint-ink:#F2D27A;
    --cS:#7EA8F5; --cV:#F08573; --cO:#56C98A; --cC:#BB98F5; --cM:#9AA5B8; --cX:#F0B55A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#11151D; --surface:#19202B; --sunk:#222B38;
  --ink:#E6EBF2; --ink2:#AEB8C7; --ink3:#8691A3; --line:#2E3847;
  --navy:#8FB0F0; --navy-ink:#0E1420;
  --hl:rgba(255,210,40,.30);
  --topic:#7EA8F5; --conn:#4FCFA3; --ref:#BB98F5;
  --ok:#56C98A; --ok-bg:#16301F; --bad:#F08573; --bad-bg:#3A1C18; --hint-bg:#352C10; --hint-ink:#F2D27A;
  --cS:#7EA8F5; --cV:#F08573; --cO:#56C98A; --cC:#BB98F5; --cM:#9AA5B8; --cX:#F0B55A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--topic);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
h1,h2,h3{line-height:1.3;margin:0}

/* ── home ── */
.hero{padding:44px 0 26px}
.hero h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:700;letter-spacing:-.02em}
.hero p{color:var(--ink2);margin:10px 0 0;max-width:58ch}
.howto{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding:0;list-style:none;counter-reset:h}
.howto li{counter-increment:h;font-size:.86rem;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 6px}
.howto li::before{content:counter(h);display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--navy);color:var(--navy-ink);font-size:.72rem;font-weight:700;margin-right:6px;vertical-align:1px}
.group{margin:22px 0 40px}
.group h2{font-size:.95rem;color:var(--ink3);font-weight:600;margin-bottom:8px}
.plist{border-top:2px solid var(--ink)}
.prow{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.prow:hover .ptitle{text-decoration:underline;text-underline-offset:3px}
.pnum{font-family:var(--serif);font-weight:700;font-size:2.6rem;line-height:1;color:var(--navy);font-variant-numeric:lining-nums}
.ptype{font-size:.8rem;color:var(--ink3)}
.ptitle{font-weight:600;font-size:1.05rem;display:block}
.pprog{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.segs{display:flex;gap:2px}
.segs i{width:9px;height:6px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--ok)}
.ptxt{font-size:.75rem;color:var(--ink3)}
.foot{color:var(--ink3);font-size:.8rem;padding:10px 0 50px}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--ink3);cursor:pointer;font-size:.8rem}

/* ── passage header ── */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:12px;padding:10px 0 6px}
.back{text-decoration:none;font-size:.9rem;color:var(--ink2);padding:6px 10px 6px 0;white-space:nowrap}
.ph .pnum{font-size:2rem}
.ph .meta{flex:1;min-width:0}
.ph h1{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;font-size:.93rem;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--navy)}
.tab .ck{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:2px}

main{padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}
.card>h2{font-size:1.12rem;margin-bottom:6px}
.lead{color:var(--ink2);font-size:.93rem;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--navy-ink);border:0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink3);font-size:.88rem}
.icon{width:18px;height:18px;flex:none}
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink2)}
.say:hover{color:var(--navy);border-color:var(--navy)}

/* ── vocab ── */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vcard{position:relative;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;min-height:64px}
.vcard:hover{border-color:var(--navy)}
.vw{display:block;font-family:var(--serif);font-weight:600;font-size:1.08rem}
.vp{font-size:.78rem;color:var(--ink3)}
.badge{position:absolute;bottom:8px;right:8px;font-size:.66rem;font-weight:600;color:var(--topic);border:1px solid currentColor;border-radius:4px;padding:0 4px;line-height:1.5}
dialog{border:0;border-radius:14px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(12,18,30,.55)}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.dhead .t{flex:1}
.dbody{padding:16px 20px 20px;max-height:min(70vh,620px);overflow:auto}
.x{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink3);padding:2px 6px}
.word{font-family:var(--serif);font-size:1.9rem;font-weight:700;line-height:1.15}
.ctxm{display:inline-block;margin-top:6px;font-weight:600;background:linear-gradient(transparent 55%,var(--hl) 55%)}
.dl{margin:0 0 14px}
.dl dt{font-size:.8rem;font-weight:700;color:var(--ink3);margin-bottom:4px}
.dl dd{margin:0}
.dl ol{margin:0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--serif);font-size:.95rem;border-radius:999px;padding:2px 11px;border:1.5px solid var(--line)}
.chip.syn{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.chip.ant{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.ex{background:var(--sunk);border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:.95rem;line-height:1.7}
.ex .ko{display:block;font-family:var(--sans);font-size:.86rem;color:var(--ink2);margin-top:6px}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.dnav{display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line)}

/* ── mcq ── */
.qhead h2{font-size:1.12rem}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qprog{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--navy);transition:width .3s}
.qtext{font-weight:600;margin:0 0 12px}
.qword{font-family:var(--serif);font-size:1.5rem;font-weight:700;display:block;margin:2px 0}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .on{flex:none;font-weight:700;color:var(--ink3)}
.opt.en .ot{font-family:var(--serif)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.75;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);font-weight:600}
.opt.right .on{color:var(--ok)}
.opt:disabled{cursor:default}
.fb:empty{display:none}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:.93rem}
.fb p{margin:6px 0 0}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.ok>b{color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.bad>b{color:var(--bad)}
.hint{background:var(--hint-bg);color:var(--hint-ink);border-radius:6px;padding:8px 10px}
.hint>span{font-weight:700;margin-right:6px}
.score{font-family:var(--serif);font-size:3rem;font-weight:700;color:var(--navy);line-height:1}

/* ── passage marks ── */
.passage{font-family:var(--serif);font-size:1.06rem;line-height:1.95}
.passage p{margin:0 0 12px}
.passage .plabel{font-family:var(--sans);font-weight:700;font-size:.82rem;color:var(--ink3);display:block;margin-bottom:2px}
.key{background:linear-gradient(transparent 58%,var(--hl) 58%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tp{text-decoration:underline;text-decoration-color:var(--topic);text-decoration-thickness:2.5px;text-underline-offset:4px;color:var(--topic);font-weight:600}
.cn{color:var(--conn);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--conn);border-radius:4px;padding:0 3px}
.rf{color:var(--ref);font-weight:600;border-bottom:2px dotted var(--ref);cursor:pointer}
.rf sup{font-family:var(--sans);font-size:.62em;margin-left:1px}
.rn{display:none;font-family:var(--sans);font-size:.78rem;font-weight:600;color:var(--ref);background:color-mix(in srgb,var(--ref) 12%,transparent);border-radius:4px;padding:1px 6px;margin:0 3px}
.show-refs .rn,.rn.open{display:inline}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;margin-bottom:14px;color:var(--ink2)}
.legend span{font-family:var(--serif)}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.alist li:last-child{border-bottom:0}
.alist .n{flex:none;min-width:24px;font-weight:700;color:var(--ref)}
.alist .en{font-family:var(--serif)}
.rtag{flex:none;font-size:.75rem;font-weight:700;color:var(--hint-ink);background:var(--hint-bg);border-radius:4px;padding:1px 6px;height:fit-content;margin-top:3px}

/* ── translation ── */
.sc{border-top:1px solid var(--line);padding:16px 0}
.sc:first-of-type{border-top:0;padding-top:4px}
.schead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sno{font-weight:700;font-size:.85rem;color:var(--navy)}
.para{font-size:.75rem;font-weight:700;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.sen{font-family:var(--serif);font-size:1.04rem;line-height:1.9;margin:0 0 10px}
.sl{color:var(--cX);font-weight:700;margin:0 4px;font-family:var(--sans)}
.chunks{display:grid;gap:4px;margin:10px 0}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:7px 10px;background:var(--paper);border-radius:6px;font-size:.92rem}
.ch .e{font-family:var(--serif)}
.ch .k{color:var(--ink2)}
.full{border-left:4px solid var(--navy);padding:8px 12px;background:var(--sunk);border-radius:0 6px 6px 0;font-size:.95rem}
.full b{display:block;font-size:.78rem;color:var(--ink3);margin-bottom:2px}

/* ── syntax ── */
.segline{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-start;margin:6px 0 18px}
.seg{display:flex;flex-direction:column;--c:var(--cM)}
.seg .st{font-family:var(--serif);font-size:1.02rem;padding:3px 7px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--c) 11%,transparent);border-bottom:3px solid var(--c)}
.seg .sb{font-size:.72rem;font-weight:700;color:var(--c);padding:3px 2px 0;line-height:1.3}
.seg.r-S{--c:var(--cS)}.seg.r-V{--c:var(--cV)}.seg.r-O{--c:var(--cO)}.seg.r-C{--c:var(--cC)}.seg.r-M{--c:var(--cM)}.seg.r-X{--c:var(--cX)}
.seg.r-M .st{border-bottom-style:dashed}
.rleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;margin-bottom:12px}
.rleg span::before{content:"";display:inline-block;width:12px;height:4px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:3px}
.notes{margin:0;padding-left:20px}
.notes li{margin-bottom:8px;font-size:.95rem}

/* ── ordering ── */
.slots{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;min-height:50px;font-size:.95rem}
.slot.empty{border:1.5px dashed var(--line);color:var(--ink3)}
.slot.filled{border:1.5px solid var(--navy);background:var(--surface);cursor:pointer}
.slot.good{border-color:var(--ok);background:var(--ok-bg)}
.slot.nope{border-color:var(--bad);background:var(--bad-bg)}
.sn{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-weight:700;font-size:.8rem;color:var(--ink2)}
.slot.filled .sn{background:var(--navy);color:var(--navy-ink)}
.pool{display:grid;gap:7px;margin-bottom:14px}
.pi{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:.95rem}
.pi:hover{border-color:var(--navy)}
.pool-label{font-size:.8rem;font-weight:700;color:var(--ink3);margin:0 0 6px}

/* ── variants ── */
.vqh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.vnum{font-weight:700}
.tag{font-size:.78rem;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--sunk);color:var(--ink2)}
.done{font-size:.75rem;font-weight:700;color:var(--ok);margin-left:auto}
.psg{font-family:var(--serif);font-size:1rem;line-height:1.9;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px}
.psg p{margin:0 0 10px}.psg p:last-child{margin-bottom:0}
.psg u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.psg .given{border:1.5px solid var(--ink3);border-radius:6px;padding:8px 10px}
.psg .summary{border-top:2px solid var(--ink3);padding-top:10px;margin-top:12px}
.blank{display:inline-block;width:9em;border-bottom:2px solid var(--ink);vertical-align:-2px;margin:0 2px}

/* ── full passage dialog ── */
.fullpsg{font-family:var(--serif);font-size:1.05rem;line-height:1.95}
.fullpsg p{margin:0 0 12px}
.note{font-size:.85rem;color:var(--ink2);background:var(--sunk);border-radius:6px;padding:8px 10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:30;max-width:90vw}

@media (max-width:560px){
  .prow{grid-template-columns:54px 1fr auto;gap:10px}
  .pnum{font-size:2.1rem}
  .ch{grid-template-columns:1fr;gap:2px}
  .card{padding:16px 14px}
  .ph .btn{padding:7px 10px;font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ex:["거의 점검되지 않는다는 사실은 언급되지만, 점검해야 한다는 주장은 없어요.","오히려 의식적인 정신은 너무 느리고 비용이 크다고 했어요.","정답! 기본 설정(자동화)은 결함이 아니라 복잡한 삶을 감당할 수 있게 해 주는 핵심 기능이라는 것이 주제예요.","‘The default is not a flaw’라고 분명히 부정했어요.","모든 것을 신중하게 판단하려는 생명체는 경쟁에서 밀린다고 했으므로 반대예요."]},

psg:`A person who lives eighty years lives some twenty-nine thousand days, and the overwhelming majority of the behaviour ① <u>packed</u> into them ② <u>runs</u> on settings laid down, most of them, decades earlier and rarely inspected since. This need not be a hopeless thought. In one light it is a triumph of engineering. If you had to consciously decide every footstep and every fork-grip and every word, you would never make it out of bed; the deliberate mind is far too slow and too costly ③ <u>to run</u> a whole life in real time, and any creature that tried would be ④ <u>outcompeted</u> by a creature that didn’t. The automation is precisely ⑤ <u>that</u> frees the captain to come up on deck for the few problems that actually require him.`,

{type:"어휘",q:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",
psg:`If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture ① <u>weakens</u> the intermediary institutions in society (e.g. the family or the school), ② <u>diminishing</u> their role and overlapping these institutions. For example, courts are traditional social institutions and ③ <u>important</u> for the normal and harmonious functioning of collective life. However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is ④ <u>beneficial</u>. Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks. In a democratic state of law, the ⑤ <u>appropriate</u> place to judge and make justice is the court.`,
opts:["weakens","diminishing","important","beneficial","appropriate"],a:3,
hint:"④ 바로 다음 문장이 ‘Justice must not be done in the public square’예요. 필자는 SNS로 판결에 압력을 넣는 관행을 좋게 볼까요?",
ex:["대중문화가 문화적 유대를 약화시키는 요인이라면 매개 기관도 ‘약화시킨다’는 것이 자연스러워요.","기관의 역할을 ‘축소시킨다’는 것은 약화와 같은 흐름이에요.","법원은 집단생활의 원만한 기능에 ‘중요하다’는 것이 맞아요.","정답! However로 시작하는 문제 제기 문장이고 이어서 ‘정의는 광장에서 실현되면 안 된다’고 했으므로 <b>harmful(해로운)</b>이 맞아요.","정의를 실현할 ‘적절한’ 장소는 법원이라는 결론이므로 맞아요."]},
{type:"글의 순서",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",
psg:`<p class="given">If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.</p><p><b>(A)</b> However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.</p><p><b>(B)</b> For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.</p><p><b>(C)</b> Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks. In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.</p>`,
opts:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],a:1,

ex:["(A)의 However는 법원의 긍정적 역할이 먼저 나와야 대조가 성립해요. 주어진 글 바로 뒤에 올 수 없어요.","정답! 매개 기관(주어진 글) → 법원이라는 예시(B) → 그러나 SNS 압력의 문제(A) → 정의는 법정에서(C) 순서예요.","(C)의 ‘the public square … the social networks’는 (A)에서 SNS가 먼저 언급되어야 이해돼요.","(C)가 먼저 오면 SNS가 무엇과 관련되는지 알 수 없어요.","(C)가 맨 앞에 오기 어렵고, 결론인 (C)는 마지막에 와야 자연스러워요."]}
]

psg:`Social media has altered business, politics, and friendships, ① <u>making</u> going viral a household term. The global financial industry links every bank and countless households in every country, making us vulnerable to human error ② <u>taking</u> place on the other side of the world. As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby ③ <u>buffered</u> from the effects of errors outside their walls. That is no longer the case. The digitization of massive amounts of information ④ <u>have</u> continued to grow enormously as the cost of computing power has decreased. The development of smart systems that ⑤ <u>communicate</u> autonomously gave rise to an infinite variety of potential breakdowns.`,

ex:["‘and it made ~’의 의미인 분사구문(결과)으로 making이 맞아요. make + O(going viral) + C(a household term) 구조예요.","human error를 뒤에서 꾸미는 현재분사로, 실수가 ‘일어나는’ 능동 관계이므로 맞아요.","기관들이 ‘보호받는’ 것이므로 were (thereby) buffered의 과거분사가 맞아요.","정답! 주어는 단수 명사 The digitization이므로 have가 아니라 <b>has</b>가 되어야 해요.","관계절의 선행사가 복수 smart systems이므로 communicate가 맞아요."]},

psg:`<p class="given">That is no longer the case.</p><p>Social media has altered business, politics, and friendships, making going viral a household term. ( ① ) The global financial industry links every bank and countless households in every country, making us vulnerable to human error taking place on the other side of the world. ( ② ) As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby buffered from the effects of errors outside their walls. ( ③ ) The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased. ( ④ ) The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns. ( ⑤ ) This interdependence is a breeding ground for complex failure.</p>`,

]

ex:["첫 문장 대시(—) 사이의 정의와 일치해요.","‘it can be construed in different ways’와 일치해요.","정답! 두 번째 해석 ‘또한(also)’ 슬픔과 분노를 가져오지만 ‘더 낮은 수준’일 뿐이라고 했어요. 전혀 일으키지 않는 것이 아니에요.","‘it might also bring some positive emotions, such as hope, strength, or gratitude’와 일치해요.","‘might accumulate to shape people’s psychological health’와 일치해요."]},
{type:"어휘",q:"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",
psg:`Reappraisal — changing the way one thinks about emotional situations — might present a particularly effective avenue to regulating emotions because it transforms emotions at their ① <u>root</u>. Take, for example, someone who is going through a divorce. This is often an ② <u>adverse</u> event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one’s family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run. As a result of these different construals, one might feel different emotions. The first construal may bring ③ <u>intense</u> sadness and anger. The second construal might also bring sadness and anger but perhaps at ④ <u>higher</u> levels. Crucially, it might also bring some positive emotions. When repeated over time, these short-term emotional consequences of reappraisal might ⑤ <u>accumulate</u> to shape people’s psychological health.`,
opts:["root","adverse","intense","higher","accumulate"],a:3,

ex:["재평가는 감정을 ‘근본(root)’에서 바꾼다는 뜻으로 적절해요.","이혼은 흔히 ‘불행한(adverse)’ 사건이라는 것이 자연스러워요.","평생의 상실로 보는 첫 번째 해석은 ‘강렬한(intense)’ 감정을 가져오므로 적절해요.","정답! 두 번째 해석은 슬픔과 분노를 ‘더 낮은(lower)’ 수준으로 가져와요. higher는 흐름과 반대예요.","단기적 효과가 반복되며 ‘쌓여(accumulate)’ 심리적 건강을 형성한다는 것이 맞아요."]}
]

{type:"요약문 완성",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",
psg:`<p>Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, these materials rarely ended up in archives. Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by elites. Yet rather than simply take such sources at face value, they read them “against the grain”. A social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.</p><p class="summary">Because historical records are <b>(A)</b> toward elites, social historians read elite-produced documents <b>(B)</b> to find traces of ordinary people’s lives.</p>`,
opts:["(A) biased ― (B) critically","(A) balanced ― (B) literally","(A) biased ― (B) literally","(A) limited ― (B) carelessly","(A) open ― (B) critically"],a:0,

ex:["정답! 기록이 엘리트 쪽으로 ‘편향되어(biased)’ 있어서, 문서를 ‘비판적으로(critically)’ 읽어야 해요.","기록은 균형 잡힌(balanced) 것이 아니라 치우쳐 있어요. literally(글자 그대로)는 at face value와 같은 뜻이라 반대예요.","(A)는 맞지만, (B) literally는 ‘액면 그대로’ 읽는다는 뜻이라 필자의 설명과 반대예요.","carelessly(부주의하게)는 ‘매우 창의적이어야 한다’는 내용과 맞지 않아요.","기록은 엘리트에게 ‘열려 있던(open)’ 것이 아니라 엘리트 중심으로 ‘치우쳐’ 있었어요."]},
{type:"어법",q:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
psg:`Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not ① <u>produce</u> substantial amounts of documentation. Even when they ② <u>did</u> produce documentation, these materials rarely ended up in archives ③ <u>which</u> they could be preserved and made available to researchers. Because of such biases in the historical record, social historians have to be very ④ <u>creative</u> in their work. Like other historians, social historians analyze textual sources ⑤ <u>produced</u> by government officials, employers, and other elites.`,

ex:["did not 뒤에는 동사원형이 오므로 produce가 맞아요.","동사 produce를 강조하는 조동사 did로 맞아요.","정답! 뒤에 빠진 성분이 없는 완전한 절이 오므로 관계대명사 which가 아니라 장소를 나타내는 관계부사 <b>where</b>(= in which)가 필요해요.","be동사(have to be)의 보어로 형용사 creative가 맞아요.","문헌 자료가 엘리트에 의해 ‘만들어진’ 것이므로 수동의 과거분사 produced가 맞아요."]},
{type:"함축 의미",q:"밑줄 친 <u>read them “against the grain”</u>이 다음 글에서 의미하는 바로 가장 적절한 것은?",
psg:`Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than simply take such sources at face value, they <u>read them “against the grain”</u>. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.`,

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const plain=s=>s.en.map(c=>c[0]).join(" ");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function speak(t){
  try{
    if(!("speechSynthesis" in window)){toast("이 브라우저에서는 발음 듣기를 지원하지 않아요.");return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/[“”]/g,""));u.lang="en-US";u.rate=.85;
    const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;speechSynthesis.speak(u);
  }catch(e){toast("발음을 재생하지 못했어요. 브라우저 소리 설정을 확인해 주세요.")}
}

function wordRe(t){return new RegExp((/^\w/.test(t)?"\\b":"")+escRe(t)+(/\w$/.test(t)?"\\b":""),"g")}
function findNth(text,t,n){const re=wordRe(t);let m,c=0;while((m=re.exec(text))){c++;if(c===(n||1))return m.index}return -1}

/* build HTML from text + non-overlapping spans */
function markup(text,spans){
  spans=spans.filter(s=>s.s>=0).sort((a,b)=>a.s-b.s);
  let out="",pos=0,last=-1;
  for(const sp of spans){if(sp.s<last)continue;out+=esc(text.slice(pos,sp.s))+sp.open+esc(text.slice(sp.s,sp.e))+sp.close;pos=sp.e;last=sp.e}
  return out+esc(text.slice(pos));
}

/* find an example sentence for a vocab word */
function stemOf(x){return x.length>4?x.slice(0,Math.max(4,x.length-3)):x}
function findExample(p,v){
  const res=[];
  if(v.f)res.push(new RegExp(escRe(v.f),"i"));
  res.push(new RegExp("\\b"+v.w.split(" ").map(escRe).join("\\s+")+"\\b","i"));
  res.push(new RegExp("\\b"+v.w.split(" ").map(x=>escRe(stemOf(x))+"[\\w’-]*").join("\\s+"),"i"));
  for(const re of res){for(let i=0;i<p.sents.length;i++){const t=plain(p.sents[i]);const m=t.match(re);if(m)return{t,ko:p.sents[i].ko,m:m[0],idx:m.index}}}
  if(v.x){for(const re of res){const m=v.x[0].match(re);if(m)return{t:v.x[0],ko:v.x[1],m:m[0],idx:m.index,fx:1}}}
  return null;
}
function exampleHTML(p,v,mode){
  const ex=findExample(p,v);if(!ex)return "";
  const a=esc(ex.t.slice(0,ex.idx)),b=esc(ex.t.slice(ex.idx+ex.m.length));
  const mid=mode==="blank"?`<mark>${esc(ex.m[0])}${"_".repeat(Math.max(3,ex.m.length-1))}</mark>`:`<mark>${esc(ex.m)}</mark>`;
  return `<div class="ex">${a}${mid}${b}${mode==="blank"?"":`<span class="ko">${ex.ko}</span>`}</div>`;
}

/* full passage html */
function fullHTML(p){
  let html="",cur=[],label="";
  const flush=()=>{if(cur.length)html+=`<p>${label?`<span class="plabel">${label}</span>`:""}${cur.join(" ")}</p>`;cur=[]};
  p.sents.forEach(s=>{if(s.para){flush();label=s.para}cur.push(esc(plain(s)))});flush();
  return html;
}

/* ── generic multiple choice ── */
function mcq(host,q,onSolve,opts={}){
  let tries=0,solved=false;
  host.innerHTML=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt ${opts.en?"en":""}" data-i="${i}"><span class="on">${CIRC[i]}</span><span class="ot">${o}</span></button>`).join("")}</div><div class="fb" aria-live="polite"></div>`;
  const fb=host.querySelector(".fb"),btns=[...host.querySelectorAll(".opt")];
  btns.forEach(b=>b.addEventListener("click",()=>{
    if(solved||b.disabled)return;const i=+b.dataset.i;
    if(i===q.a){
      solved=true;b.classList.add("right");btns.forEach(x=>x.disabled=true);
      fb.className="fb ok";
      fb.innerHTML=`<b>${tries===0?"정답이에요. 한 번에 맞혔어요!":"정답이에요. 잘 찾아냈어요!"}</b><p>${strip(q.ex[i])}</p>${opts.after||""}${opts.retry===false?"":`<p><button class="linkbtn" data-retry>다시 풀어 보기</button></p>`}`;
      const r=fb.querySelector("[data-retry]");if(r)r.onclick=()=>mcq(host,q,onSolve,opts);
      onSolve&&onSolve(tries===0);
    }else{
      tries++;b.classList.add("wrong");b.disabled=true;fb.className="fb bad";
      fb.innerHTML=`<b>다시 생각해 볼까요?</b><p><b>${CIRC[i]}</b> ${q.ex[i]||""}</p>${q.hint?`<p class="hint"><span>힌트</span>${q.hint}</p>`:""}`;
    }
  }));
}

  document.title=`${p.id}번 ${p.title} | 영어Ⅱ 지문 복습 노트`;
  app.innerHTML=`<div class="sticky"><div class="wrap">
    <div class="ph"><a class="back" href="#">‹ 목록</a><span class="pnum">${p.id}</span><div class="meta"><div class="ptype">${p.src.replace("2026학년도 ","")} ${p.type}</div><h1>${p.title}</h1></div><button class="btn sm" id="fullBtn">지문 전체 보기</button></div>
    <nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${state.tab===k}">${l}<span class="ckwrap" data-ck="${k}"></span></button>`).join("")}</nav>
  </div></div><main class="wrap" id="tb"></main>`;
  document.getElementById("fullBtn").onclick=()=>showFull(p);
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;app.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));renderTab();window.scrollTo({top:0});b.scrollIntoView({inline:"nearest",block:"nearest"})});
  renderTab();updateChecks();window.scrollTo(0,0);
}
function updateChecks(){
  const p=state.p;if(!p)return;const g=PROG[p.id];
  const st={vocab:g&&g.vq!=null,flow:g&&g.topic&&g.flow,variant:g&&g.v.every(Boolean)};
  app.querySelectorAll("[data-ck]").forEach(s=>{s.innerHTML=st[s.dataset.ck]?'<span class="ck" title="완료"></span>':""});
}
function renderTab(){
  const p=state.p,tb=document.getElementById("tb");
  ({vocab:tVocab,analysis:tAnalysis,trans:tTrans,syntax:tSyntax,flow:tFlow,variant:tVariant})[state.tab](p,tb);
}

function showFull(p){
  dlg.innerHTML=`<div class="dhead"><div class="t"><div class="ptype">${p.src} ${p.type}</div><h2>${p.id}번 지문 전체</h2></div><button class="say" id="fsay" title="지문 듣기" aria-label="지문 듣기">${SPK}</button><button class="x" aria-label="닫기">×</button></div>
  <div class="dbody"><div class="fullpsg">${fullHTML(p)}</div><p class="note">${p.orig}</p></div>`;
  dlg.querySelector(".x").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}dlg.close()};
  dlg.querySelector("#fsay").onclick=()=>speak(p.sents.map(plain).join(" "));
  dlg.showModal();
}
dlg.addEventListener("click",e=>{if(e.target===dlg){try{speechSynthesis.cancel()}catch(_){}dlg.close()}});

/* ── 1. vocab ── */
function tVocab(p,tb){
  const g=pr(p.id);
  tb.innerHTML=`<section class="card"><h2>단어장 <span class="muted" style="font-weight:500">${p.vocab.length}개</span></h2><p class="lead">단어를 누르면 뜻, 다양한 뜻, 유의어·반의어, 어원과 발음, 지문 속 문장을 볼 수 있어요. <span class="badge" style="position:static">학습지</span> 표시는 수업 학습지 Pre-Vocab에도 나온 단어예요.</p>
  <div class="vgrid">${p.vocab.map((v,i)=>`<button class="vcard" data-i="${i}"><span class="vw">${v.w}</span><span class="vp">${v.p}</span>${v.core?'<span class="badge">학습지</span>':""}</button>`).join("")}</div></section>
  <section class="card" id="vq"></section>`;
  tb.querySelectorAll(".vcard").forEach(b=>b.onclick=()=>wordDlg(p,+b.dataset.i));
  vqIntro(p,document.getElementById("vq"));
}
function wordDlg(p,i){
  const v=p.vocab[i];
  dlg.innerHTML=`<div class="dhead"><div class="t"><div class="word">${v.w}</div><span class="vp">${v.p}</span> <span class="ctxm">${v.m}</span></div><button class="say" id="wsay" title="발음 듣기" aria-label="발음 듣기">${SPK}</button><button class="x" aria-label="닫기">×</button></div>
  <div class="dbody">
   <dl class="dl"><dt>다양한 뜻</dt><dd><ol>${v.ms.map(m=>`<li>${m}</li>`).join("")}</ol></dd></dl>
   ${v.syn.length?`<dl class="dl"><dt>유의어</dt><dd class="chips">${v.syn.map(s=>`<span class="chip syn">${s}</span>`).join("")}</dd></dl>`:""}
   ${v.ant.length?`<dl class="dl"><dt>반의어</dt><dd class="chips">${v.ant.map(s=>`<span class="chip ant">${s}</span>`).join("")}</dd></dl>`:""}
   <dl class="dl"><dt>어원</dt><dd>${v.ety}</dd></dl>
   <dl class="dl"><dt>${(findExample(p,v)||{}).fx?"문제 선택지·예문":"지문 속 문장"}</dt><dd>${exampleHTML(p,v)||'<span class="muted">지문에서 직접 찾아보세요.</span>'}</dd></dl>
  </div>
  <div class="dnav"><button class="btn ghost sm" id="wprev" ${i===0?"disabled":""}>‹ 이전 단어</button><span class="muted">${i+1} / ${p.vocab.length}</span><button class="btn ghost sm" id="wnext" ${i===p.vocab.length-1?"disabled":""}>다음 단어 ›</button></div>`;
  dlg.querySelector(".x").onclick=()=>dlg.close();
  dlg.querySelector("#wsay").onclick=()=>speak(v.w);
  dlg.querySelector("#wprev").onclick=()=>wordDlg(p,i-1);
  dlg.querySelector("#wnext").onclick=()=>wordDlg(p,i+1);
  if(!dlg.open)dlg.showModal();
  speak(v.w);
}
function vqIntro(p,host){
  const g=pr(p.id);
  host.innerHTML=`<h2>어휘 퀴즈</h2><p class="lead">단어장 ${p.vocab.length}개 가운데 10개가 무작위로 나오는 4지선다 퀴즈예요. 단어의 뜻을 고르거나 뜻에 맞는 단어를 골라요. 틀리면 지문 속 문장으로 힌트를 줄게요. 풀 때마다 문제가 바뀌어요.</p>
  <div class="row"><button class="btn" id="vstart">${g.vq!=null?"다시 풀기":"퀴즈 시작"}</button>${g.vq!=null?`<span class="muted">최고 기록: 한 번에 맞힌 문제 ${g.vq} / 10</span>`:""}</div>`;
  host.querySelector("#vstart").onclick=()=>vqRun(p,host);
}
function buildVQ(p){
  const V=p.vocab;
  return shuffle(V.map((_,i)=>i)).slice(0,10).map((vi,k)=>{
    const v=V[vi];const others=shuffle(V.map((_,i)=>i).filter(i=>i!==vi)).slice(0,3);
    const ids=shuffle([vi,...others]);const a=ids.indexOf(vi);
    if(k%2===0){
      return{prompt:`<span class="muted">다음 단어의 문맥상 뜻으로 알맞은 것은?</span><span class="qword">${v.w}</span>`,
        opts:ids.map(i=>V[i].m),a,en:false,
        ex:ids.map(i=>i===vi?`<b>${v.w}</b> = ${v.m}<br><span class="muted">어원: ${v.ety}</span>`:`‘${V[i].m}’은(는) <b>${V[i].w}</b>의 뜻이에요.`),
        hint:`지문 속 문장에서 쓰임을 확인해 보세요.${exampleHTML(p,v)||""}`};
    }
    return{prompt:`<span class="muted">다음 뜻에 해당하는 단어는?</span><span class="qword" style="font-family:var(--sans);font-size:1.25rem">${v.m}</span>`,
      opts:ids.map(i=>V[i].w),a,en:true,
      ex:ids.map(i=>i===vi?`<b>${v.w}</b> = ${v.m}<br><span class="muted">어원: ${v.ety}</span>`:`<b>${V[i].w}</b>은(는) ‘${V[i].m}’(이)라는 뜻이에요.`),
      hint:`빈칸에 들어갈 단어예요. 첫 글자를 참고하세요.${exampleHTML(p,v,"blank")||""}`};
  });
}
function vqRun(p,host){
  const qs=buildVQ(p);let k=0,score=0;
  const draw=()=>{
    const q=qs[k];
    host.innerHTML=`<div class="qhead"><h2>어휘 퀴즈</h2><span class="muted">${k+1} / ${qs.length}</span></div><div class="qprog"><i style="width:${k/qs.length*100}%"></i></div>
    <p class="qtext">${q.prompt}</p><div id="mh"></div><div class="row" id="nx" style="margin-top:12px"></div>`;
    mcq(host.querySelector("#mh"),q,first=>{
      if(first)score++;
      const nx=host.querySelector("#nx");
      nx.innerHTML=`<button class="btn">${k<qs.length-1?"다음 문제":"결과 보기"}</button>`;
      nx.querySelector("button").onclick=()=>{k++;k<qs.length?draw():finish()};
    },{en:q.en,retry:false});
  };
  const finish=()=>{
    const g=pr(p.id);g.vq=Math.max(g.vq||0,score);save();updateChecks();
    const msg=score>=9?"아주 훌륭해요! 이 지문의 어휘는 거의 완벽해요.":score>=7?"잘했어요. 틀린 단어만 다시 확인해 보세요.":"어휘 카드를 한 번 더 살펴본 뒤 다시 도전해 보세요.";
    host.innerHTML=`<h2>어휘 퀴즈 결과</h2><p class="muted" style="margin:8px 0 2px">한 번에 맞힌 문제</p><div class="score">${score} <span style="font-size:1.4rem;color:var(--ink3)">/ ${qs.length}</span></div><p>${msg}</p><div class="row"><button class="btn" id="again">다시 풀기</button></div>`;
    host.querySelector("#again").onclick=()=>vqRun(p,host);
  };
  draw();
}

/* ── 2. analysis ── */
function tAnalysis(p,tb){
  let rn=0;const refs=[];
  const paras=[];let cur=null;
  p.sents.forEach((s,i)=>{
    const t=plain(s),sp=[];
    p.ann.tp.filter(a=>a[0]===i).forEach(a=>{const st=findNth(t,a[1],1);sp.push({s:st,e:st+a[1].length,open:'<span class="tp">',close:"</span>"})});
    p.ann.cn.filter(a=>a[0]===i).forEach(a=>{const st=findNth(t,a[1],1);sp.push({s:st,e:st+a[1].length,open:`<span class="cn" title="${a[2]}">`,close:"</span>"})});
    p.ann.rf.filter(a=>a[0]===i).forEach(a=>{const st=findNth(t,a[1],a[3]);if(st<0)return;rn++;refs.push({n:rn,i,w:a[1],m:a[2]});sp.push({s:st,e:st+a[1].length,open:`<span class="rf" tabindex="0" data-r="${rn}">`,close:`<sup>${rn}</sup></span><span class="rn" data-rn="${rn}">= ${esc(a[2])}</span>`})});
    const html=markup(t,sp);
    if(s.para||!cur){cur={label:s.para||"",items:[]};paras.push(cur)}
    cur.items.push(s.k?`<span class="key">${html}</span>`:html);
  });
  const keys=p.sents.map((s,i)=>({s,i})).filter(x=>x.s.k);
  tb.innerHTML=`<section class="card"><h2>지문 분석</h2>
   <div class="legend"><span class="key">핵심 문장</span><span class="tp">소재</span><span class="rf">지시어<sup>1</sup></span><span class="cn">연결어</span></div>
   <div class="row" style="margin-bottom:12px"><button class="btn ghost sm" id="togRef">지시 대상 모두 보기</button><button class="say" id="psay" title="지문 듣기" aria-label="지문 듣기">${SPK}</button><span class="muted">보라색 낱말을 누르면 가리키는 대상이 보여요.</span></div>
   <div class="passage" id="pz">${paras.map(g=>`<p>${g.label?`<span class="plabel">${g.label}</span>`:""}${g.items.join(" ")}</p>`).join("")}</div></section>
  <section class="card"><h2>핵심 문장</h2><p class="lead">요지와 글의 흐름을 잡는 데 중요한 문장이에요.</p><ul class="alist">${keys.map(x=>`<li><span class="rtag">${x.s.role||"핵심"}</span><span><span class="en">${esc(plain(x.s))}</span><br><span class="muted">${x.s.ko}</span></span></li>`).join("")}</ul></section>
  <section class="card"><h2>지시어·대명사가 가리키는 것</h2><ul class="alist">${refs.map(r=>`<li><span class="n">${r.n}</span><span><span class="en"><b>${esc(r.w)}</b></span> <span class="muted">(${r.i+1}번째 문장)</span><br>${esc(r.m)}</span></li>`).join("")}</ul></section>
  <section class="card"><h2>흐름을 이끄는 연결어</h2><ul class="alist">${p.ann.cn.map(c=>`<li><span class="en" style="min-width:9em;font-weight:600;color:var(--conn)">${esc(c[1])}</span><span>${c[2]}</span></li>`).join("")}</ul></section>`;
  const pz=document.getElementById("pz");
  document.getElementById("togRef").onclick=e=>{const on=pz.classList.toggle("show-refs");e.target.textContent=on?"지시 대상 숨기기":"지시 대상 모두 보기"};
  document.getElementById("psay").onclick=()=>speak(p.sents.map(plain).join(" "));
  pz.querySelectorAll(".rf").forEach(r=>{const f=()=>pz.querySelector(`[data-rn="${r.dataset.r}"]`).classList.toggle("open");r.onclick=f;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
}

/* ── 3. translation ── */
function tTrans(p,tb){
  tb.innerHTML=`<section class="card"><div class="qhead"><h2>끊어 읽기와 해석</h2><button class="btn ghost sm" id="allT">해석 모두 펼치기</button></div>
  <p class="lead">먼저 / 표시를 따라 끊어 읽으며 스스로 해석해 보고, 펼쳐보기로 확인하세요.</p>
  ${p.sents.map((s,i)=>`<div class="sc"><div class="schead"><span class="sno">문장 ${i+1}</span>${s.para?`<span class="para">${s.para}</span>`:""}<span style="flex:1"></span><button class="say" data-say="${i}" title="문장 듣기" aria-label="문장 듣기">${SPK}</button></div>
   <p class="sen">${s.en.map(c=>esc(c[0])).join('<span class="sl">/</span>')}</p>
   <button class="btn ghost sm" data-open="${i}" aria-expanded="false">해석 펼쳐보기</button>
   <div class="tr" id="tr${i}" hidden><div class="chunks">${s.en.map(c=>`<div class="ch"><span class="e">${esc(c[0])}</span><span class="k">${c[1]}</span></div>`).join("")}</div><div class="full"><b>전체 해석</b>${s.ko}</div></div></div>`).join("")}</section>`;
  const set=(i,on)=>{const t=document.getElementById("tr"+i),b=tb.querySelector(`[data-open="${i}"]`);t.hidden=!on;b.textContent=on?"해석 접기":"해석 펼쳐보기";b.setAttribute("aria-expanded",on)};
  tb.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>set(+b.dataset.open,document.getElementById("tr"+b.dataset.open).hidden));
  tb.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(plain(p.sents[+b.dataset.say])));
  const all=document.getElementById("allT");
  all.onclick=()=>{const open=all.dataset.on!=="1";all.dataset.on=open?"1":"0";all.textContent=open?"해석 모두 접기":"해석 모두 펼치기";p.sents.forEach((_,i)=>set(i,open))};
}

/* ── 4. syntax ── */
function tSyntax(p,tb){
  const sx=p.syn,has=new Set(sx.segs.map(s=>s[0])),used=["S","V","O","C","M","X"].filter(r=>has.has(r));
  tb.innerHTML=`<section class="card"><h2>핵심 구문 분석</h2><p class="lead">수업 학습지 Focus Structure 문장이에요. 색깔별로 문장 성분을 확인하세요.</p>
   <div class="rleg">${used.map(r=>`<span style="--c:var(--c${r})">${ROLE[r]}</span>`).join("")}</div>
   <div class="segline">${sx.segs.map(s=>`<span class="seg r-${s[0]}"><span class="st">${esc(s[1])}</span><span class="sb">${s[2]}</span></span>`).join("")}</div>
   <h3 style="font-size:1rem;margin-bottom:8px">구문 포인트</h3><ul class="notes">${sx.notes.map(n=>`<li>${n}</li>`).join("")}</ul>
   <div class="row" style="margin-top:14px"><button class="btn ghost sm" id="litB" aria-expanded="false">직역 펼쳐보기</button></div>
   <div class="full" id="lit" hidden style="margin-top:10px"><b>직역</b>${sx.lit}</div></section>`;
  const b=document.getElementById("litB"),l=document.getElementById("lit");
  b.onclick=()=>{l.hidden=!l.hidden;b.textContent=l.hidden?"직역 펼쳐보기":"직역 접기";b.setAttribute("aria-expanded",!l.hidden)};
}

/* ── 5. topic & flow ── */
function tFlow(p,tb){
  tb.innerHTML=`<section class="card"><h2>글의 주제 고르기</h2><p class="qtext">이 글의 주제로 가장 적절한 것은?</p><div id="tq"></div></section>
  <section class="card"><h2>글의 흐름 배열하기</h2><p class="lead">아래 문장을 글의 전개 순서대로 눌러 빈칸을 채우세요. 채운 칸을 누르면 다시 빠져요.</p>
  <ol class="slots" id="slots"></ol><p class="pool-label" id="plabel">남은 문장</p><div class="pool" id="pool"></div>
  <div class="row"><button class="btn" id="chk">순서 확인</button><button class="btn ghost" id="clr">모두 비우기</button></div><div class="fb" id="ffb" aria-live="polite"></div></section>`;
  mcq(document.getElementById("tq"),p.tq,()=>{pr(p.id).topic=1;save();updateChecks()},{after:`<p class="muted">수업 정리 주제: ${TOPIC[p.id]}</p>`});
  const F=p.flow;let order=[],marks=null,solved=false;
  let pool=shuffle(F.map((_,i)=>i));while(pool.every((v,i)=>v===i))pool=shuffle(pool);
  const POS=["첫 칸에는 글이 무엇을 다루는지 처음 소개하는 내용이 와요.","둘째 칸에는 소재를 구체적으로 설명하거나 예를 드는 내용이 와요.","셋째 칸에는 앞 내용을 더 깊이 이어 가거나 문제를 짚는 내용이 와요.","마지막 칸에는 ‘따라서, 결국’처럼 글의 결론이 와요."];
  const draw=()=>{
    document.getElementById("slots").innerHTML=F.map((_,k)=>order[k]!=null?`<li class="slot filled ${marks?(marks[k]?"good":"nope"):""}" data-k="${k}" tabindex="0"><span class="sn">${k+1}</span><span>${F[order[k]]}</span></li>`:`<li class="slot empty"><span class="sn">${k+1}</span><span>여기에 들어갈 문장을 아래에서 고르세요</span></li>`).join("");
    const left=pool.filter(i=>!order.includes(i));
    document.getElementById("pool").innerHTML=left.map(i=>`<button class="pi" data-i="${i}">${F[i]}</button>`).join("");
    document.getElementById("plabel").hidden=!left.length;
    document.querySelectorAll("#slots .filled").forEach(li=>{const f=()=>{if(solved)return;order.splice(+li.dataset.k,1);marks=null;document.getElementById("ffb").innerHTML="";draw()};li.onclick=f;li.onkeydown=e=>{if(e.key==="Enter")f()}});
    document.querySelectorAll("#pool .pi").forEach(b=>b.onclick=()=>{if(solved)return;order.push(+b.dataset.i);marks=null;draw()});
  };
  draw();
  document.getElementById("clr").onclick=()=>{if(solved){solved=false;pool=shuffle(pool)}order=[];marks=null;document.getElementById("ffb").innerHTML="";draw()};
  document.getElementById("chk").onclick=()=>{
    const fb=document.getElementById("ffb");
    if(solved)return;
    if(order.length<F.length){fb.className="fb bad";fb.innerHTML=`<b>빈칸이 남아 있어요.</b><p>네 칸을 모두 채운 뒤 확인해 주세요.</p>`;return}
    marks=order.map((v,k)=>v===k);
    if(marks.every(Boolean)){
      solved=true;pr(p.id).flow=1;save();updateChecks();
      fb.className="fb ok";fb.innerHTML=`<b>글의 흐름을 정확하게 파악했어요!</b><p>수업 정리 주제: <b>${TOPIC[p.id]}</b></p><p><button class="linkbtn" id="fagain">다시 배열해 보기</button></p>`;
      document.getElementById("fagain").onclick=()=>{solved=false;order=[];marks=null;pool=shuffle(pool);fb.innerHTML="";draw()};
    }else{
      const first=marks.indexOf(false),n=marks.filter(Boolean).length;
      fb.className="fb bad";fb.innerHTML=`<b>${n?`${n}개는 제자리에 있어요. 빨간 칸을 다시 살펴볼까요?`:"아직 제자리에 놓인 문장이 없어요. 처음부터 다시 생각해 볼까요?"}</b><p class="hint"><span>힌트</span>${POS[first]} ‘지문 분석’ 탭의 형광펜 문장 순서를 떠올려 보세요.</p><p class="muted">빨간 칸을 누르면 빠지니, 다시 골라 넣으세요.</p>`;
    }
    draw();
  };
}

/* ── 6. variants ── */
function tVariant(p,tb){
  const g=pr(p.id);
  tb.innerHTML=p.vq.map((q,i)=>`<section class="card"><div class="vqh"><span class="vnum">변형 문제 ${i+1}</span><span class="tag">${q.type}</span><span class="done" data-done="${i}">${g.v[i]?"완료":""}</span></div>
   <p class="qtext">${q.q}</p>
   ${q.psg?`<div class="psg">${q.psg.trim().startsWith("<p")?q.psg:`<p>${q.psg}</p>`}</div>`:`<div class="row" style="margin-bottom:12px"><button class="btn ghost sm" data-orig="${i}" aria-expanded="false">원문 펼쳐 보기</button></div><div class="psg" id="og${i}" hidden>${fullHTML(p)}</div>`}
   <div data-m="${i}"></div></section>`).join("");
  tb.querySelectorAll("[data-orig]").forEach(b=>b.onclick=()=>{const o=document.getElementById("og"+b.dataset.orig);o.hidden=!o.hidden;b.textContent=o.hidden?"원문 펼쳐 보기":"원문 접기";b.setAttribute("aria-expanded",!o.hidden)});
  p.vq.forEach((q,i)=>{
    const en=/^[ (A-Za-z“‘]/.test(q.opts[0])&&!/[가-힣]/.test(q.opts.join(""));
    mcq(tb.querySelector(`[data-m="${i}"]`),q,()=>{pr(p.id).v[i]=1;save();updateChecks();tb.querySelector(`[data-done="${i}"]`).textContent="완료"},{en});
  });
}

route();
